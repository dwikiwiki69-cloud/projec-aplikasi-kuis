<!DOCTYPE html>
<html>
<head>
    <title>Login Kuis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <div class="card p-4 shadow">
            <h3 class="text-center text-primary mb-4">Masuk Aplikasi Kuis 📚</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" name="nama" class="form-control" required placeholder="Masukkan Nama Anda">
                </div>
                <div class="mb-3">
                    <label class="form-label">NIM (Tanda Pengenal)</label>
                    <input type="text" name="nim" class="form-control" required placeholder="Masukkan NIM Anda">
                </div>
                <button type="submit" class="btn btn-primary w-100">Mulai Akses</button>
            </form>
            <div class="text-center mt-3">
                <a href="/admin" class="text-muted text-decoration-none small">Login Portal Admin</a>
            </div>
        </div>
    </div>
</body>
</html>
