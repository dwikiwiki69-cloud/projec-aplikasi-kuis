<!DOCTYPE html>
<html>
<head>
    <title>Login Admin</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark p-5">
    <div class="container" style="max-width: 400px; margin-top: 80px;">
        <div class="card p-4 shadow-lg">
            <h3 class="text-center text-danger mb-3">Gerbang Admin 🔐</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username Admin</label>
                    <input type="text" name="username" class="form-control" required placeholder="admin">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="admin123">
                </div>
                <button type="submit" class="btn btn-danger w-100">Masuk Panel Kontrol</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-muted text-decoration-none small">Kembali ke Halaman Utama</a>
            </div>
        </div>
    </div>
</body>
</html>
