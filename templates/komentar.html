<!DOCTYPE html>
<html>
<head>
    <title>Komentar Nilai</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container p-5" style="max-width: 600px; margin-top: 50px;">
    <div class="card p-4 shadow">
        <h4 class="mb-3 text-warning">Beri Komentar & Evaluasi Kuis</h4>
        <div class="bg-light p-3 rounded mb-3">
            <p class="mb-1"><b>Nama:</b> {{ data.nama }}</p>
            <p class="mb-1"><b>NIM:</b> {{ data.nim }}</p>
            <p class="mb-0"><b>Total Nilai:</b> <span class="badge bg-success">{{ data.nilai_total }}</span></p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Tulis Catatan Feedback Koreksi:</label>
                <textarea name="komentar" class="form-control" rows="4" required placeholder="Contoh: Kerja bagus, pelajari kembali materi perulangan!">{{ data.komentar }}</textarea>
            </div>
            <button type="submit" class="btn btn-success">Simpan Komentar</button>
            <a href="/admin" class="btn btn-secondary">Batal</a>
        </form>
    </div>
</body>
</html>
