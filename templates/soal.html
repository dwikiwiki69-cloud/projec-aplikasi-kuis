<!DOCTYPE html>
<html>
<head>
    <title>Lembar Soal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container p-5" style="max-width: 800px;">
    <h3 class="mb-2">{{ kuis.judul }}</h3>
    <p class="text-muted">Batas Pengumpulan: <span class="text-danger fw-bold">{{ kuis.deadline }}</span></p>
    <hr>
    
    <form method="POST">
        {% for q in questions %}
        <div class="card mb-4 p-4 shadow-sm">
            <h5>Soal {{ loop.index }}: {{ q.pertanyaan }}</h5>
            <div class="mt-3">
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="A" required>
                    <label class="form-check-label">A. {{ q.opsi_a }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="B">
                    <label class="form-check-label">B. {{ q.opsi_b }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="C">
                    <label class="form-check-label">C. {{ q.opsi_c }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="question_{{ q.id }}" value="D">
                    <label class="form-check-label">D. {{ q.opsi_d }}</label>
                </div>
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success btn-lg w-100 mt-2" onclick="return confirm('Kirim jawaban sekarang?')">Kirim Semua Jawaban</button>
    </form>
</body>
</html>
